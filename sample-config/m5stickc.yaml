# Minimal m5stickc AXP192 configuration for ESPHome 2026.10.2.
# Provide wifi_ssid and wifi_password in a local secrets.yaml.
# This example initializes power rails and exposes power diagnostics.
# Add a separate display integration only if you need on-screen output.

esphome:
  name: m5stickc

esp32:
  board: m5stick-c
  framework:
    type: esp-idf

external_components:
  - source: github://realholgi/esphome-axp192@main
    components: [axp192]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:

ota:
  - platform: esphome

i2c:
  - id: bus_a
    sda: GPIO21
    scl: GPIO22
    scan: true

sensor:
  - platform: axp192
    id: axp_power
    model: M5STICKC
    i2c_id: bus_a
    update_interval: 30s
    battery_level:
      name: "Battery Level"
    charging:
      name: "Battery Charging"
    battery_voltage:
      name: "Battery Voltage"
    usb_connected:
      name: "USB Connected"

number:
  - platform: axp192
    axp192_id: axp_power
    name: "Display Brightness"
    mode: slider
    restore_value: true
    initial_value: 100

switch:
  - platform: axp192
    id: display_enabled
    axp192_id: axp_power
    name: "Display Enabled"
    restore_value: true
    initial_value: true
    # auto_off: 5min  # Optional, leaves CPU and BLE running

# Optional: Button A wakes the backlight.
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO37
      inverted: true
    name: "Button A"
    on_press:
      - switch.turn_on: display_enabled
