name: Source regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run source regression tests
        run: python -m unittest discover -s tests -v

      - name: Build native C++ unit tests
        run: c++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. tests/test_axp192_math.cpp -o /tmp/axp192_math_tests

      - name: Run native C++ unit tests
        run: /tmp/axp192_math_tests

  firmware-build:
    name: ESPHome 2026.10.2 / ESP-IDF compile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ESPHome
        run: python -m pip install "esphome==2026.10.2"

      - name: Prepare local external component and test secrets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("sample-config/m5stickcplus-esp-idf.yaml").read_text()
          original = "  - source: github://realholgi/esphome-axp192@main"
          replacement = "  - source:\\n      type: local\\n      path: components".replace("\\n", "\n")
          assert source.count(original) == 1, "Example must reference the AXP192 component once"
          Path("ci-m5stickcplus.yaml").write_text(source.replace(original, replacement))
          Path("secrets.yaml").write_text(
              'wifi_ssid: "ci-test"\\nwifi_password: "ci-not-a-real-password"\\n'.replace("\\n", "\n")
          )
          PY

      - name: Validate firmware configuration
        run: esphome config ci-m5stickcplus.yaml

      - name: Compile firmware
        run: esphome compile ci-m5stickcplus.yaml
