name: Source regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run source regression tests
        run: python -m unittest discover -s tests -v

      - name: Build native C++ unit tests
        run: c++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. tests/test_axp192_math.cpp -o /tmp/axp192_math_tests

      - name: Run native C++ unit tests
        run: /tmp/axp192_math_tests
